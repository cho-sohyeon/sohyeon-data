<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 이름표</title>
<!--
================================================================
  Day 3 1교시 실습, 내 이름표 카드
  자바스크립트는 쓰지 않습니다. HTML 과 CSS 만 고칩니다.
  할 일
    1. div 안에 내 이름과 학과를 넣기
    2. 그 div 에 class 를 붙이고 CSS 로 꾸미기
    3. 배경색, 여백, 모서리 둥글기를 바꿔보기
    4. 이름과 학과를 가로로 나란히 놓기          (심화)
  고칠 곳은 두 군데입니다.
    아래 style 안의 TODO
    body 안의 TODO
================================================================
-->
<style>
  body {
    margin: 0; padding: 60px 28px; background: #f2f4f8;
    font-family: "Pretendard", "Malgun Gothic", sans-serif; color: #111111;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .hint { margin: 0 0 32px; font-size: 14px; color: #888888; }
  /* ===================================================
     TODO  여기에 카드 모양을 만드세요.  → 완료
     =================================================== */
  .namecard {
    background: #ffffff;         /* 3. 배경색 */
    color: #111111;              /*    글자색 */
    padding: 24px 28px;          /* 3. 안쪽 여백 (위아래 24, 좌우 28) */
    border-radius: 16px;         /* 3. 모서리 둥글기 */
    border: 1px solid #e3e7ee;   /*    얇은 테두리 */

    /* 4. 심화, 가로로 놓기 */
    display: flex;               /*    자식(span)들을 가로로 배치 */
    align-items: center;         /*    세로 중앙 정렬 */
    gap: 12px;                   /*    이름과 학과 사이 간격 */
  }
  /* 이름과 학과에 각각 다른 모양을 주고 싶으면 여기에 추가 */
  .namecard .name {
    font-size: 22px;
    font-weight: 700;
  }
  .namecard .major {
    font-size: 14px;
    color: #8B0000;              /* 딥레드 글자색 */
    background: #fdf0f0;         /* 배지처럼 보이게 */
    padding: 6px 12px;
    border-radius: 999px;        /* 완전히 둥근 알약 모양 */
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>내 이름표 만들기</h1>
    <p class="hint">아래 카드를 고쳐 보세요</p>
    <!-- ===================================================
         TODO  이 안에 내 이름과 학과를 넣으세요.  → 완료
         =================================================== -->
    <div class="namecard">
      <span class="name">조소현</span>
      <span class="major">경영학과 · 관광이벤트학과</span>
    </div>
  </div>
</body>
</html>
