<title>DOM 연습장</title>

<!--

<style>
  body {
    margin: 0; padding: 48px 28px; background: #f2f4f8;
    font-family: "Pretendard", "Malgun Gothic", sans-serif; color: #111111;
    transition: background .2s, color .2s;
  }

  /* 퀵 실습 3 에서 켜고 끌 클래스입니다. 이미 만들어 뒀습니다. */
  body.dark { background: #1e1e24; color: #e6e6ec; }
  body.dark .box { background: #2a2a33; border-color: #3a3a46; }

  .wrap { max-width: 680px; margin: 0 auto; }

  h1 { margin: 0 0 24px; font-size: 30px; }
  p { margin: 0 0 12px; font-size: 17px; line-height: 1.6; }

  .box {
    margin-top: 28px; padding: 26px 28px; min-height: 90px;
    border: 1px solid #dddddd; border-radius: 12px; background: #ffffff;
  }

  .row { display: flex; gap: 10px; margin-top: 28px; }
  button {
    padding: 13px 22px; border: 1px solid #a50034; border-radius: 10px;
    background: #ffffff; color: #a50034; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #a50034; color: #ffffff; }

  ul { margin: 0; padding-left: 22px; }
  li { font-size: 17px; line-height: 1.9; }
</style>
</head>
<body>

<script>

  // 3. 어둡게 버튼을 누를 때마다 어두운 배경이 켜졌다 꺼지게

</html>
